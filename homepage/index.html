<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SageAid Windows 客户端下载</title>
    <meta name="description" content="下载最新版 SageAid Windows 客户端。" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="SageAid 首页">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>SageAid</span>
      </a>
      <button class="customer-service-trigger" id="customer-service-trigger" type="button" aria-haspopup="dialog" aria-controls="customer-service-dialog">
        <span class="customer-service-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7.5 18.5 4 20l1-3.5a8 8 0 1 1 2.5 2Z" />
            <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" />
          </svg>
        </span>
        <span>联系客服</span>
      </button>
    </header>

    <main id="top">
      <section class="hero" id="download">
        <div class="hero-copy">
          <span class="platform-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 4.5 10.8 3.4v7.5H3V4.5Zm8.9-1.3L21 2v8.9h-9.1V3.2ZM3 12h7.8v7.5L3 18.4V12Zm8.9 0H21v9l-9.1-1.3V12Z" />
            </svg>
            Windows 客户端
          </span>
          <h1>下载 <span>SageAid</span></h1>
          <p class="intro">获取最新版 Windows 安装包。安装后登录你的账号即可使用。</p>

          <a id="download-button" class="download-button is-loading" href="#" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2" />
            </svg>
            <span id="download-label">正在获取最新版本…</span>
          </a>

          <div class="release-meta" aria-live="polite">
            <span id="version">版本获取中</span>
            <span id="file-size">Windows 10 / 11 · 64 位</span>
            <span id="release-date"></span>
          </div>
          <p id="download-error" class="download-error" hidden></p>
        </div>

        <aside class="download-card" aria-label="安装包信息">
          <div class="app-icon" aria-hidden="true">S</div>
          <div>
            <p class="eyebrow">最新版</p>
            <h2 id="card-version">SageAid for Windows</h2>
            <p id="file-name" class="file-name">正在连接下载服务…</p>
          </div>
          <div class="card-rule"></div>
          <dl>
            <div><dt>支持系统</dt><dd>Windows 10 / 11</dd></div>
            <div><dt>系统类型</dt><dd>64 位</dd></div>
            <div><dt>安装方式</dt><dd>下载安装包后运行</dd></div>
          </dl>
        </aside>
      </section>

      <section id="release-notes" class="release-notes" hidden>
        <p class="eyebrow">本次更新</p>
        <p id="release-notes-text"></p>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> SageAid</span>
      <span>请仅在合法合规、已获授权的环境中使用。</span>
    </footer>

    <dialog class="customer-service-dialog" id="customer-service-dialog" aria-labelledby="customer-service-title">
      <div class="customer-service-modal">
        <div class="customer-service-heading">
          <div>
            <p class="eyebrow">CUSTOMER SERVICE</p>
            <h2 id="customer-service-title">联系客服</h2>
            <p>扫描二维码，添加专属客服</p>
          </div>
          <button class="customer-service-close" id="customer-service-close" type="button" aria-label="关闭客服弹窗">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <img src="assets/img/customer-service.png" alt="Telegram 客服二维码" />
      </div>
    </dialog>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
